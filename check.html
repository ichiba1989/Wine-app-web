const APP_SCRIPT = "app.js?v=12";
const LIBRARIES = ["https://esm.sh/@supabase/supabase-js@2.109.0", "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.109.0/+esm"];
const out = document.getElementById("out"), sum = document.getElementById("sum");
const lines = []; let problems = 0, first = "";
const note = (kind, text) => {
  if (kind === "FAIL") { problems++; if (!first) first = text; }
  lines.push(kind.padEnd(4) + " " + text); out.textContent = lines.join("\n");
};
const norm = (t) => t.replace(/\r\n/g, "\n").replace(/\s+$/, "");
const sha = async (t) => [...new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(norm(t))))].map((b) => b.toString(16).padStart(2, "0")).join("");
const msg = (e) => String((e && e.message) || e);

note("INFO", "Page: " + location.href);
note("INFO", "Time: " + new Date().toISOString());

// 1. every file on the site, compared with the version in the guide
for (const [name, f] of Object.entries(FILES)) {
  try {
    const r = await fetch("./" + name + "?check=" + Date.now(), { cache: "no-store" });
    if (!r.ok) { note("FAIL", name + ": is missing from the site (HTTP " + r.status + "). Create it from the guide."); continue; }
    const text = await r.text();
    const same = (await sha(text)) === f.hash;
    if (same) note("OK", name + ": matches the guide");
    else note("FAIL", name + ": is different from the guide (" + norm(text).length + " characters on the site, expected " + f.chars + "). Paste it again from the guide.");
    if (name === "index.html" && !text.includes(APP_SCRIPT)) note("FAIL", "index.html: does not point at " + APP_SCRIPT + ", so it is an old version.");
    if (same && f.query) {
      const t2 = await (await fetch("./" + name + "?v=" + f.query)).text();
      if ((await sha(t2)) !== f.hash) note("FAIL", name + ": the site is right, but THIS BROWSER holds an old copy. Clear this site's data (see the guide) and reload.");
    }
  } catch (e) { note("FAIL", name + ": could not be checked (" + msg(e) + ")"); }
}

// 2. config.js: your two connection values
let url = "", key = "";
try {
  const r = await fetch("./config.js?check=" + Date.now(), { cache: "no-store" });
  if (!r.ok) note("FAIL", "config.js: is missing from the site (HTTP " + r.status + "). The page will ask for the values instead.");
  else {
    const t = await r.text();
    url = ((t.match(/SUPABASE_URL\s*=\s*"([^"]*)"/) || [])[1] || "").trim().replace(/\/+$/, "");
    key = ((t.match(/SUPABASE_KEY\s*=\s*"([^"]*)"/) || [])[1] || "").trim();
    if (/[\u201c\u201d\u2018\u2019]/.test(t)) note("FAIL", "config.js: contains curly quotes. Your keyboard changed the quote marks. Retype them as straight quotes (\").");
    else if (!url || !key) note("FAIL", "config.js: could not find both values between straight quotes.");
    else if (url.includes("PASTE") || key.includes("PASTE")) note("FAIL", "config.js: still has the PASTE placeholders. Put your project URL and publishable key in.");
    else if (!/^https:\/\/[^\s]+\.[^\s]+$/.test(url)) note("FAIL", "config.js: the URL must start with https://");
    else {
      let secret = key.startsWith("sb_secret_");
      try { const p = JSON.parse(atob(key.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))); if (p.role === "service_role") secret = true; } catch (_) {}
      if (secret) note("FAIL", "config.js: this is a SECRET key. Remove it from config.js right away and use the publishable (anon) key. Then rotate the secret key in Supabase.");
      else note("OK", "config.js: URL " + url.replace(/^https:\/\//, "") + ", key " + key.slice(0, 14) + "… (" + key.length + " characters)");
    }
  }
} catch (e) { note("FAIL", "config.js: could not be checked (" + msg(e)); }

// 3. the outside library the page loads: the app tries these in order, so one working source is enough
let working = 0;
for (const lib of LIBRARIES) {
  const where = lib.includes("esm.sh") ? "esm.sh" : "jsDelivr";
  try {
    const m = await import(lib);
    if (typeof m.createClient === "function") { working++; note("OK", "Database library from " + where + ": loads"); }
    else note("INFO", "Database library from " + where + ": loaded but looks wrong");
  } catch (e) { note("INFO", "Database library from " + where + ": did not load (" + msg(e) + ")"); }
}
if (!working) note("FAIL", "The database library did not load from either source. The outside services may be down or blocked on this network. Try again later or on another network.");
else if (working === 1) note("INFO", "One of the two library sources is unreachable. The app will use the other one.");

// 3b. the privacy page: it must exist and have a contact email filled in
try {
  const r = await fetch("./privacy.html?check=" + Date.now(), { cache: "no-store" });
  if (!r.ok) note("FAIL", "privacy.html: is missing from the site (HTTP " + r.status + "). Create it from the guide.");
  else if ((await r.text()).includes("PASTE-CONTACT-EMAIL")) note("FAIL", "privacy.html: the contact email is still the PASTE-CONTACT-EMAIL placeholder. Put your email in.");
  else note("OK", "privacy.html: present, with a contact email");
} catch (e) { note("FAIL", "privacy.html: could not be checked (" + msg(e) + ")"); }

// 4. each file loads and has everything the app needs (the same addresses the app uses)
for (const [name, f] of Object.entries(FILES)) {
  if (!f.query || !f.exports.length) continue;
  try {
    const m = await import("./" + name + "?v=" + f.query);
    const missing = f.exports.filter((x) => !(x in m));
    if (missing.length) note("FAIL", name + ": loads, but is missing " + missing.join(", ") + ". It is an old or damaged copy.");
    else note("OK", name + ": loads and has everything the app needs");
  } catch (e) { note("FAIL", name + ": failed to load (" + msg(e) + ")"); }
}

// 5. does the database answer to these two values
if (url && key && !url.includes("PASTE") && !key.includes("PASTE")) {
  try {
    const r = await fetch(url + "/auth/v1/settings", { headers: { apikey: key } });
    if (!r.ok) note("FAIL", "Supabase said HTTP " + r.status + " to these two values. Check the URL and the key in config.js.");
    else {
      const j = await r.json().catch(() => ({}));
      note("OK", "Supabase answers to these two values");
      note("INFO", "Email sign-in: " + (j.external && j.external.email ? "on" : "off") + ", new sign-ups: " + (j.disable_signup ? "off" : "on"));
    }
  } catch (e) { note("FAIL", "Could not reach Supabase at " + url + " (" + msg(e) + ")."); }
}

sum.textContent = problems ? problems + " problem" + (problems > 1 ? "s" : "") + ". First: " + first : "Everything the app needs is here and correct. If the page still does not load, close every tab of the app, clear this site's data, and reload.";
sum.className = problems ? "bad" : "good";
document.getElementById("copy").onclick = async () => {
  const text = sum.textContent + "\n\n" + lines.join("\n");
  try { await navigator.clipboard.writeText(text); document.getElementById("copy").textContent = "Copied"; }
  catch (_) { const r = document.createRange(); r.selectNodeContents(out); const s = getSelection(); s.removeAllRanges(); s.addRange(r); document.getElementById("copy").textContent = "Selected: tap Copy in the menu"; }
};
