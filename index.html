<html lang="en">
<head>

<!-- Nothing here uses plug-ins, a <base> tag or forms, so these are switched off for good: even a page that was somehow altered could not use them. -->
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'">
<title>Vintage Wine Merchants</title>
<style>
  :root { --ts:1; --bg:#DCE4DA; --panel:#F2F5F0; --ink:#16261D; --muted:#5A6A5F; --wine:#7B1E3A; --slate:#3E5C76; --moss:#3A4B40; --line:#C3CFC1; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: -apple-system, "Segoe UI", system-ui, sans-serif; }
  #app { max-width: 480px; margin: 0 auto; height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
  .serif { font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif; }
  .muted { color: var(--muted); } .small { font-size: calc(12px * var(--ts)); } .wine { color: var(--wine); }
  button { font: inherit; color: inherit; cursor: pointer; }
  input, select, textarea { font: inherit; color: var(--ink); }
  .center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 28px; gap: 12px; }
  .btn { border: 0; border-radius: 14px; padding: 14px 18px; font-size: calc(16px * var(--ts)); font-weight: 600; width: 100%; margin-top: 8px; }
  .btn.primary { background: var(--wine); color: #fff; } .btn.primary:disabled { background: #B9C4B8; }
  .btn.outline { background: transparent; border: 1px solid var(--ink); font-weight: 500; }
  .field { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; font-size: calc(15px * var(--ts)); background: #fff; margin-top: 8px; }
  .err { color: var(--wine); font-size: calc(12px * var(--ts)); min-height: 16px; margin-top: 6px; }
  .top { display: flex; align-items: baseline; justify-content: space-between; padding: 14px 20px 10px; }
  .top h1 { margin: 0; font-size: calc(22px * var(--ts)); font-weight: 400; }
  .content { flex: 1; min-height: 0; overflow-y: auto; padding: 0 16px 10px; }
  #tabbody { min-height: 100%; display: flex; flex-direction: column; }
  .banner { background: var(--wine); color: #fff; border-radius: 10px; padding: 8px 10px; font-size: calc(12px * var(--ts)); margin: 0 16px 8px; }
  .banner[hidden] { display: none; }
  .banner.good { background: var(--slate); }
  .cardwrap { position: relative; flex: 1 1 0; min-height: 360px; max-height: 600px; }   /* fills what is left, but never taller than 600 px: a tall phone gets even space above and below instead */
  .behind { will-change: transform, opacity; position: absolute; inset: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 24px; opacity: .7; transform: scale(.95) translateY(10px); }
  .card { will-change: transform; transform-origin: 50% 115%; position: absolute; inset: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 24px; overflow: hidden; display: flex; flex-direction: column; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; box-shadow: 0 18px 40px -22px rgba(22,38,29,.5); }
  .swipe-label { z-index: 2; position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%); padding: 6px 16px; border-radius: 999px; color: #fff; font-weight: 600; font-size: calc(14px * var(--ts)); opacity: 0; pointer-events: none; white-space: nowrap; }
  .body { display: flex; flex-direction: column; justify-content: center; gap: 16px; flex: 1 1 0; min-height: 0; overflow: hidden; padding: 20px 20px 18px; }
  .topline { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .vpill { margin-left: auto; flex: 0 0 auto; font-size: calc(13px * var(--ts)); font-weight: 600; padding: 3px 12px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255,255,255,.55); }
  .producer, .title { font-size: calc(28px * var(--ts)); line-height: 1.1; word-break: break-word; }   /* the producer is as important as the wine's name, so both are the same size */
  .title { margin-top: 6px; }
  .metaline { display: flex; align-items: center; gap: 7px; font-size: calc(13px * var(--ts)); color: var(--muted); }
  .metaline .flag { font-size: calc(15px * var(--ts)); line-height: 1; }
  .tdot { flex: 0 0 auto; width: 10px; height: 10px; border-radius: 50%; }
  .visrow { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 18px; }   /* the tint behind it is set from the wine's type */
  .visrow svg.bottle { flex: 0 0 auto; height: 112px; width: auto; }
  .facts { display: flex; flex-wrap: wrap; gap: 2px 12px; min-height: 0; overflow: hidden; margin-top: 2px; font-size: calc(12.5px * var(--ts)); line-height: 1.4; }
  .derived { text-decoration: underline dotted; text-underline-offset: 4px; text-decoration-color: var(--muted); }
  .marks { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .marks .flag { line-height: 1; }
  .belowcard { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; }
  body[data-tab="discover"] .top { padding: 6px 20px 2px; }
  body[data-tab="discover"] .top h1 { font-size: calc(16px * var(--ts)); }
  body[data-tab="discover"] .content { padding-bottom: 2px; }
  .fbline { margin: 0; text-align: right; font-size: calc(11px * var(--ts)); flex: 0 0 auto; }
  .fbline .link { font-size: calc(11px * var(--ts)); padding: 2px 0; }
  .tabs { display: flex; background: var(--panel); border-top: 1px solid var(--line); }
  .tabs button { flex: 1; border: 0; background: transparent; padding: 12px 0; font-size: calc(13px * var(--ts)); font-weight: 500; color: var(--muted); }
  .tabs button.on { color: var(--wine); }
  .stack { display: flex; flex-direction: column; gap: 8px; }
  .sect { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .sect-head { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px; border: 0; background: transparent; padding: 12px 14px; font-size: calc(14px * var(--ts)); font-weight: 600; text-align: left; }
  .sect-head .chev { font-size: calc(10px * var(--ts)); color: var(--muted); }
  .sect-body { padding: 0 14px 10px; }
  .swrow1 { display: flex; gap: 6px; align-items: stretch; margin-bottom: 8px; }
  .swtabs { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .swtab { border: 1px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink, #222); padding: 8px 4px; min-height: 44px; display: flex; align-items: center; justify-content: center; gap: 5px; font-size: calc(13px * var(--ts)); }
  .swtab .swn { font-weight: 600; }
  .swtab.on { background: var(--ink, #222); color: #fff; border-color: transparent; }
  .swmore { position: relative; width: 44px; flex: none; border: 1px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink, #222); display: flex; align-items: center; justify-content: center; }
  .swmore.on { background: var(--line); }
  .swdot { position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: #7B1E3A; }
  .swpanel { margin-bottom: 4px; }
  .pill.icon { display: inline-flex; align-items: center; justify-content: center; padding: 6px 10px; }
  .ico { display: block; flex: none; }
  .swrow { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; margin-bottom: 8px; }
  .swrow .sortsel { margin-bottom: 0; }
  [data-swq] { margin-top: 8px; }
  .sortsel { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 7px 10px; font-size: calc(12px * var(--ts)); background: #fff; margin-bottom: 4px; }
  .item { padding: 10px 0; border-top: 1px solid var(--line); }
  .iname { display: flex; align-items: center; gap: 8px; }
  .iname .serif { font-size: calc(16px * var(--ts)); }
  .meta { font-size: calc(12px * var(--ts)); color: var(--muted); }
  .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .pill { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 12px; font-size: calc(12px * var(--ts)); }
  .pill.dark { background: var(--ink); color: #fff; border-color: var(--ink); font-weight: 600; }
  .pill.wine { background: var(--wine); color: #fff; border-color: var(--wine); font-weight: 600; padding: 7px 16px; font-size: calc(14px * var(--ts)); }
  .pill.wine:disabled { background: #B9C4B8; border-color: #B9C4B8; }
  .pill.big { padding: 0 14px; font-size: calc(14px * var(--ts)); white-space: nowrap; }
  .link { border: 0; background: transparent; color: var(--slate); text-decoration: underline; font-size: calc(12px * var(--ts)); padding: 4px 0; }
  .link.block { display: block; width: 100%; padding: 10px 0; font-size: calc(13px * var(--ts)); border-top: 1px solid var(--line); }
  .jbar { position: sticky; top: 0; z-index: 5; background: var(--bg); padding-bottom: 8px; }
  .jtop { display: flex; gap: 8px; align-items: stretch; }
  .jtop .field { margin-top: 0; }
  .jsel { display: flex; gap: 8px; margin-top: 8px; }
  .jsel .sortsel { margin-bottom: 0; padding: 9px 10px; font-size: calc(13px * var(--ts)); }
  .jmeta { display: flex; justify-content: space-between; align-items: center; font-size: calc(13px * var(--ts)); color: var(--muted); margin: 2px 0 8px; min-height: 22px; }
  .btable td, .btable th { font-size: calc(12px * var(--ts)); }
  .btable .br.match td:last-child { color: #2f6b3c; font-weight: 600; }
  .btable .br.close td:last-child { color: #8a6a1c; font-weight: 600; }
  .btable .br.miss td:last-child { color: #7B1E3A; font-weight: 600; }
  .gopt.fromnotes, .gstep.fromnotes { outline: 2px dashed #3E5C76; outline-offset: -2px; }
  .notebar, .unplaced, .teach { margin: 6px 0 10px; }
  .wordbtn { text-transform: none; font-style: italic; }
  .teachbox { border: 1px solid var(--line); border-radius: 12px; padding: 10px; background: #fff; display: grid; gap: 8px; }
  .wordfix { margin: 4px 0 8px; }
  .chip.wfix { flex: none; white-space: normal; }
  .speaklang { width: auto; min-width: 150px; }
  .microw { display: flex; align-items: center; gap: 10px; margin: 6px 0 10px; }
  .pill.mic { display: inline-flex; align-items: center; gap: 6px; }
  .pill.mic[aria-pressed="true"], .btn[aria-pressed="true"] { background: #7B1E3A; color: #fff; }
  .micinterim { min-height: 18px; font-style: italic; }
  .jmeta .chip { flex: none; margin: 0 8px; }
  .incomp { color: #7B1E3A; font-weight: 600; }
  .jmeta .links { display: flex; gap: 14px; }
  .jrow { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; border: 0; border-top: 1px solid var(--line); background: transparent; padding: 10px 0; text-align: left; }
  .jl { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .jl .meta { display: block; }
  .overlay { position: fixed; inset: 0; z-index: 30; background: rgba(22,38,29,.45); display: flex; align-items: flex-end; justify-content: center; }
  .sheet { width: 100%; max-width: 480px; max-height: 92vh; max-height: 92dvh; overflow-y: auto; background: var(--panel); border-radius: 24px 24px 0 0; padding: 0 20px 24px; }
  .sheethead { position: sticky; top: 0; z-index: 2; background: var(--panel); padding: 18px 0 10px; display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
  .foodbox { margin-top: 6px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
  .foodrow { margin-top: 6px; font-size: calc(13px * var(--ts)); }
  .sheettitle { min-width: 0; } .sheettitle .big { font-size: calc(20px * var(--ts)); }
  .sheetbtns { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .xbtn { border: 0; background: transparent; font-size: calc(30px * var(--ts)); line-height: 1; padding: 0 4px; color: var(--ink); }
  .verdicts { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
  .vbtn { width: 100%; text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 12px; padding: 12px 14px; font-size: calc(15px * var(--ts)); }
  .vbtn.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .vbtn.tog { text-align: center; padding: 10px 6px; }
  .three { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 10px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  h3.serif { font-size: calc(18px * var(--ts)); font-weight: 400; margin: 20px 0 6px; }
  .dim { margin-top: 12px; }
  .dimtop { display: flex; justify-content: space-between; align-items: center; font-size: calc(14px * var(--ts)); }
  .dimrow { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .dimrow input[type=range] { flex: 1; min-width: 0; accent-color: var(--slate); }
  .round { width: 36px; height: 36px; flex-shrink: 0; border-radius: 50%; border: 1px solid var(--line); background: #fff; font-size: calc(20px * var(--ts)); line-height: 1; padding: 0; }
  .steplabels { display: flex; justify-content: space-between; font-size: calc(11px * var(--ts)); color: var(--muted); padding: 0 44px; }
  .steplabels span.on { color: var(--ink); font-weight: 600; }
  .dimlabels { display: flex; justify-content: space-between; font-size: calc(11px * var(--ts)); color: var(--muted); padding: 0 44px; }
  textarea.field { resize: none; }
  /* Start-up problems and account links */
  #bootError { position: fixed; inset: 0; z-index: 100; background: var(--bg, #dfe6dd); display: flex; align-items: center; justify-content: center; padding: 24px; }
  #bootError[hidden] { display: none; }
  .bootbox { max-width: 420px; font-size: calc(15px * var(--ts)); line-height: 1.45; }
  .bootbox b { font-size: calc(20px * var(--ts)); display: block; margin-bottom: 8px; }
  .bootdetail { font: 12.5px/1.45 ui-monospace, Menlo, monospace; background: #fff; border-radius: 10px; padding: 10px; word-break: break-word; }
  .bootbox button { font: inherit; padding: 10px 16px; border-radius: 12px; border: 0; background: #14201a; color: #fff; }
  .nudge { background: #f3f6f1; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin: 10px 0 4px; font-size: calc(14px * var(--ts)); line-height: 1.4; }
  .nudgeacts { display: flex; align-items: center; gap: 14px; margin-top: 8px; }
  .nudgeacts .btn { margin: 0; }
  .acctfoot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; margin-top: 14px; font-size: calc(13px * var(--ts)); }
  .link.dangerlink { color: #D32F2F; font-weight: 600; }
  .link.dangerlink:active { color: #B71C1C; }
  /* Quiz verification: the correct answer stands out */
  .qlabel { font-size: calc(12px * var(--ts)); font-weight: 600; color: var(--muted); margin: 10px 0 2px; } .qlabel.good { color: #2F6B3A; } .qlabel.bad { color: var(--wine); }
  .nvrow { display: flex; align-items: center; gap: 6px; font-size: calc(14px * var(--ts)); padding-top: 22px; }
  .okmark { color: #2F6B3A; font-weight: 700; }
  .field.correct { border: 2px solid #2F6B3A; background: #EAF4EA; } .field.wrong { border-color: #D8B4B4; background: #FBF3F3; }
  /* The rating window: numbered pages */
  .wtop { position: sticky; top: 0; z-index: 3; background: var(--panel); }
  .wtop .sheethead { position: static; padding: 4px 0 8px; }
  .wnav { display: flex; align-items: center; justify-content: space-between; padding-top: 6px; }
  .wcorner { width: 44px; height: 40px; border: 0; background: transparent; font-size: calc(34px * var(--ts)); line-height: 1; color: var(--ink); padding: 0; }
  .wcorner:first-child { text-align: left; } .wcorner:last-child { text-align: right; }
  .wsteps { display: flex; gap: 8px; }
  .wstep { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line); background: #fff; font-size: calc(12px * var(--ts)); font-weight: 600; padding: 0; color: var(--muted); }
  .wstep.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .wpages { touch-action: pan-y; min-height: 300px; }
  .wpage[hidden] { display: none; }
  .wfoot { position: sticky; bottom: 0; background: var(--panel); padding: 8px 0 4px; }
  .wfoot .btn { margin-top: 0; }
  .stylerow { display: flex; gap: 6px; margin: 6px 0 10px; flex-wrap: wrap; }
  .stylerow .chip { flex: 1 1 auto; text-align: center; }
  .looklike { background: #fff7e6; border: 1px solid #f0d49a; border-radius: 10px; padding: 6px 8px; margin-top: 4px; font-size: calc(13px * var(--ts)); }   /* "Looks like ... already in our list" */
  .looklike .link { font-size: calc(13px * var(--ts)); margin-right: 8px; }
  .desigchips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }   /* designation (DOC, DOCG, AOC ...) chips, on a place */
  .desigchips .chip { flex: 0 0 auto; padding: 6px 10px; font-size: calc(12px * var(--ts)); }
  .seg.sub { margin-top: 0; } .seg.sub[hidden] { display: none; }
  .deleterow { margin-top: 36px; text-align: right; }
  .deletelink { border: 0; background: transparent; padding: 2px 0; font-size: calc(10px * var(--ts)); color: #8A978D; text-decoration: none; opacity: .8; }
  .delsmall { align-self: center; border: 0; background: transparent; padding: 2px 0; margin-left: auto; font-size: calc(10px * var(--ts)); color: #8A978D; opacity: .8; }
  .infobtn { margin-top: 8px; }
  .confirmname { font-size: calc(16px * var(--ts)); margin: 6px 0 10px; }
  /* Structure rules: suggestions, the gold set and the rule test */
  .goldtag { display: inline-block; font-size: calc(10px * var(--ts)); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: #fff; background: #B08A3E; border-radius: 6px; padding: 1px 6px; vertical-align: 1px; }
  .goldbanner, .rulebanner { border-radius: 12px; padding: 10px 12px; font-size: calc(13px * var(--ts)); line-height: 1.4; margin: 8px 0; }
  .goldbanner { background: #F1E6CC; border: 1px solid #D8C592; }
  .rulebanner { background: #E3EDE1; border: 1px solid var(--line); }
  .touch { font-size: calc(12px * var(--ts)); color: #9A5A1E; margin: -2px 0 6px; } .touch.done { color: #2F6B3A; } .touch .link { font-size: calc(12px * var(--ts)); }
  .rulenote { font-size: calc(12px * var(--ts)); color: var(--muted); margin: -2px 0 8px; line-height: 1.35; }
  .conf { color: var(--slate); letter-spacing: 1px; font-size: calc(10px * var(--ts)); }
  .scaleguide { margin: 10px 0 4px; font-size: calc(13px * var(--ts)); } .scaleguide summary { cursor: pointer; color: var(--slate); font-weight: 600; } .scaleguide p { margin: 6px 0; }
  .cmpgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; margin-top: 6px; }
  .cmp { display: flex; justify-content: space-between; gap: 8px; font-size: calc(13px * var(--ts)); padding: 3px 6px; border-radius: 8px; }
  .cmp.off { background: #F3D9D9; }
  .vgood { color: #2F6B3A; font-weight: 600; } .vok { color: #9A7B1E; font-weight: 600; } .vbad { color: var(--wine); font-weight: 600; }
  #testText { font: 11.5px/1.45 ui-monospace, Menlo, monospace; }
  /* Accounts */
  .okbox { background: #E3EDE1; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: calc(13px * var(--ts)); margin: 10px 0 4px; }
  .codefield { text-align: center; font-size: calc(24px * var(--ts)); letter-spacing: .3em; }
  .acctlinks { display: flex; justify-content: space-between; gap: 12px; margin-top: 12px; }
  .acctlinks .link:disabled { color: var(--muted); text-decoration: none; }
  /* Fixed choices (oak, CO2), delete buttons and the confirmation */
  .seg { display: flex; gap: 6px; margin: 6px 0 4px; }
  .segbtn { flex: 1; border: 1px solid var(--line); background: #fff; border-radius: 12px; padding: 11px 4px; font-size: calc(14px * var(--ts)); }
  .segbtn.on { background: var(--ink); color: #fff; border-color: var(--ink); font-weight: 600; }
  .segbtn.on.def { background: var(--slate); border-color: var(--slate); }
  .btn.danger { background: transparent; color: var(--wine); border: 1px solid var(--wine); font-weight: 500; }
  .btn.danger:disabled { opacity: .5; }
  .pill.danger { color: var(--wine); border-color: var(--wine); }
  .overlay.top { z-index: 60; align-items: center; padding: 20px; }
  .sheet.small { border-radius: 20px; padding: 20px; max-height: none; }
  .sheet.small .two { margin-top: 10px; } .sheet.small .btn { margin-top: 0; }
  /* Photos, thumbnails, feedback and the editor */
  .thumb { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; flex-shrink: 0; background: var(--line); }
  .item.withthumb { display: flex; gap: 10px; align-items: flex-start; } .ibody { min-width: 0; flex: 1; }
  .jrow .thumb { margin-right: 10px; }
  .thumb.bottle { object-fit: contain; background: #fff; padding: 2px; box-sizing: border-box; }   /* a bottle photo is shown whole, not cropped */
  .photoarea { margin-top: 12px; } .photoarea.top { margin-top: 4px; }
  .phs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .ph { position: relative; width: 72px; height: 72px; } .ph img { width: 72px; height: 72px; object-fit: cover; border-radius: 10px; display: block; }
  .ph.gone img { opacity: .3; }

  /* The Discover card. The card, its button row and the reminder are one block (.deckstage), centred between the header and the tab bar.
     On the card: a small bottle, then the name (a link to a Google image search) with the country map beside it, the six flavors, then the facts.
     The free space inside the card is shared evenly between those parts, so there is no blank area at the bottom. When a phone is short the facts are clipped, never the flavors. */
  .deckstage { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; justify-content: center; }
  .winelink { display: block; color: inherit; text-decoration: none; cursor: pointer; }
  .winelink .producer, .winelink .title { text-decoration: underline; text-decoration-color: rgba(62,92,118,.5); text-decoration-thickness: 1px; text-underline-offset: 5px; }

  .mapbtn { position: relative; flex: 0 0 72px; width: 72px; height: 72px; padding: 0; margin: 0; border: 0; border-radius: 12px; background: #d6e4ea; cursor: pointer; -webkit-tap-highlight-color: transparent; }

  .mapbtn .badge.hint { animation: zpulse 1.7s ease-out 3; }
  @keyframes zpulse { 0% { box-shadow: 0 0 0 0 rgba(123,30,58,.5), 0 2px 6px #0004; } 70% { box-shadow: 0 0 0 12px rgba(123,30,58,0), 0 2px 6px #0004; } 100% { box-shadow: 0 0 0 0 rgba(123,30,58,0), 0 2px 6px #0004; } }
  @media (prefers-reduced-motion: reduce) { .mapbtn .badge.hint { animation: none; } }
  html.reduce-motion .mapbtn .badge.hint { animation: none; }
  .flavors { flex: 1 1 auto; min-width: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 2px; }
  .fl { min-width: 0; display: flex; flex-direction: column; align-items: center; text-align: center; }

  .fl span { font-size: calc(11px * min(var(--ts), 1.2)); overflow-wrap: anywhere; line-height: 1.15; margin-top: 3px; color: #3d4a43; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; max-width: 100%; }
  #zoom:empty { display: none; }
  .zoomback { position: fixed; inset: 0; z-index: 80; background: rgba(20, 30, 25, .55); display: flex; align-items: center; justify-content: center; padding: 18px; animation: zfade .18s ease; }
  .zoombox { position: relative; width: min(92vw, 68vh, 420px); background: #fff; border-radius: 18px; padding: 10px 10px 12px; box-shadow: 0 10px 40px #0005; }
  .zoomx { position: absolute; top: -12px; right: -12px; width: 34px; height: 34px; border-radius: 50%; border: 0; background: #fff; font-size: calc(22px * var(--ts)); line-height: 30px; box-shadow: 0 2px 8px #0004; z-index: 3; cursor: pointer; }
  .stage { position: relative; width: 100%; aspect-ratio: 1 / 1; border-radius: 12px; overflow: hidden; background: #eaf0e6; cursor: pointer; }
  .stage:focus-visible { outline: 3px solid var(--slate); outline-offset: 2px; }
  /* The zoom views are stacked. The one for the current step is shown; the ones before it have zoomed past (out from the pin), the ones after it are still small. */
  .layer { position: absolute; inset: 0; opacity: 0; transform: scale(.4); pointer-events: none; transform-origin: 50% 50%; transition: transform .75s cubic-bezier(.2, .7, .2, 1), opacity .75s ease; }
  .layer svg { width: 100%; height: 100%; display: block; }

  .layer.region { transform-origin: var(--px) var(--py); }
  .stage[data-step="0"] .layer[data-i="0"], .stage[data-step="1"] .layer[data-i="1"], .stage[data-step="2"] .layer[data-i="2"] { opacity: 1; transform: scale(1); }
  .stage[data-step="1"] .layer[data-i="0"], .stage[data-step="2"] .layer[data-i="0"], .stage[data-step="2"] .layer[data-i="1"] { opacity: 0; transform: scale(2.8); }
  .zcap { margin-top: 10px; text-align: center; font-weight: 600; font-size: calc(14px * var(--ts)); }

  @media (prefers-reduced-motion: reduce) { .layer { transition: opacity .15s linear; transform: none !important; } .zoomback { animation: none; } }

  /* ---- settings, answer buttons, card zoom */
  button, a, .gopt, .ans { touch-action: manipulation; }   /* no double-tap-to-zoom delay on controls; the card handles its own touches */

<script>
// If the app cannot start, say why on the screen instead of leaving a blank page.
(function () {
  window.__booted = false;
  var shown = false;
  function show(detail) {
    if (window.__booted || shown) return;
    shown = true;
    var el = document.getElementById("bootError");
    el.innerHTML = '<div class="bootbox"><b>The app could not start.</b><p>Reloading often fixes it. If it keeps happening, send the message below to whoever runs the app.</p><p class="bootdetail"></p><p><button onclick="location.reload()">Reload</button></p></div>';
    el.querySelector(".bootdetail").textContent = detail;
    el.hidden = false;
  }
  window.__bootFailed = show;
  window.addEventListener("error", function (e) {
    // only problems in this site's own files, so unrelated browser extensions cannot trigger it
    if (e.filename && e.filename.indexOf(location.origin) === 0) show(e.message || "A file of the app has an error.");
  });
  window.addEventListener("unhandledrejection", function (e) { show(String((e.reason && e.reason.message) || e.reason || "Unknown problem")); });
  setTimeout(function () { show("The app is taking too long to start. Check your connection."); }, 20000);
})();
</script>
