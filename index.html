<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Wine app (phone test)</title>
<style>
  :root { --bg:#DCE4DA; --panel:#F2F5F0; --ink:#16261D; --muted:#5A6A5F; --wine:#7B1E3A; --slate:#3E5C76; --moss:#3A4B40; --line:#C3CFC1; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: -apple-system, "Segoe UI", system-ui, sans-serif; }
  #app { max-width: 480px; margin: 0 auto; height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
  .serif { font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif; }
  .muted { color: var(--muted); } .small { font-size: 12px; } .wine { color: var(--wine); }
  button { font: inherit; color: inherit; cursor: pointer; }
  input, select, textarea { font: inherit; color: var(--ink); }
  .center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 28px; gap: 12px; }
  .btn { border: 0; border-radius: 14px; padding: 14px 18px; font-size: 16px; font-weight: 600; width: 100%; margin-top: 8px; }
  .btn.primary { background: var(--wine); color: #fff; } .btn.primary:disabled { background: #B9C4B8; }
  .btn.outline { background: transparent; border: 1px solid var(--ink); font-weight: 500; }
  .field { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; font-size: 15px; background: #fff; margin-top: 8px; }
  .err { color: var(--wine); font-size: 12px; min-height: 16px; margin-top: 6px; }
  .top { display: flex; align-items: baseline; justify-content: space-between; padding: 14px 20px 10px; }
  .top h1 { margin: 0; font-size: 22px; font-weight: 400; }
  .content { flex: 1; min-height: 0; overflow-y: auto; padding: 0 16px 10px; }
  #tabbody { min-height: 100%; display: flex; flex-direction: column; }
  .banner { background: var(--wine); color: #fff; border-radius: 10px; padding: 8px 10px; font-size: 12px; margin: 0 16px 8px; }
  .banner[hidden] { display: none; }
  .banner.good { background: var(--slate); }
  .cardwrap { position: relative; flex: 1; min-height: 260px; }
  .behind { position: absolute; inset: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 24px; opacity: .7; transform: scale(.95) translateY(10px); }
  .card { position: absolute; inset: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 24px; overflow: hidden; display: flex; flex-direction: column; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; box-shadow: 0 18px 40px -22px rgba(22,38,29,.5); }
  .image { position: relative; height: 42%; background: linear-gradient(180deg,#E3EAE0,#CBD8C9); display: flex; align-items: flex-end; justify-content: center; }
  .image svg.bottle { height: 88%; margin-bottom: 6px; }
  .sample { position: absolute; bottom: 4px; right: 12px; font-size: 10px; color: var(--muted); }
  .swipe-label { position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%); padding: 6px 16px; border-radius: 999px; color: #fff; font-weight: 600; font-size: 14px; opacity: 0; pointer-events: none; white-space: nowrap; }
  .body { flex: 1; overflow: hidden; padding: 14px 20px 10px; }
  .vintage { font-size: 20px; font-weight: 700; color: var(--wine); letter-spacing: .04em; }
  .prow { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-top: 2px; }
  .producer { font-size: 26px; line-height: 1.1; word-break: break-word; }
  .cuvee { font-size: 18px; margin-top: 2px; }
  .facts { margin-top: 10px; font-size: 15px; }
  .derived { text-decoration: underline dotted; text-underline-offset: 4px; text-decoration-color: var(--muted); }
  .legend { margin-top: 10px; font-size: 11px; color: var(--muted); }
  .marks { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .marks .flag { line-height: 1; }
  .switch { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 12px; background: var(--line); border-radius: 999px; padding: 4px; }
  .switch button { border: 0; background: transparent; padding: 9px 0; border-radius: 999px; font-weight: 500; }
  .switch button.on { color: #fff; }
  .hint { margin: 8px 0 0; text-align: center; font-size: 11px; color: var(--muted); }
  .counts { margin: 6px 0 0; text-align: center; font-size: 11px; }
  .fbline { margin: 6px 0 0; text-align: center; font-size: 11px; }
  .tabs { display: flex; background: var(--panel); border-top: 1px solid var(--line); }
  .tabs button { flex: 1; border: 0; background: transparent; padding: 12px 0; font-size: 13px; font-weight: 500; color: var(--muted); }
  .tabs button.on { color: var(--wine); }
  .stack { display: flex; flex-direction: column; gap: 8px; }
  .sect { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .sect-head { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px; border: 0; background: transparent; padding: 12px 14px; font-size: 14px; font-weight: 600; text-align: left; }
  .sect-head .chev { font-size: 10px; color: var(--muted); }
  .sect-body { padding: 0 14px 10px; }
  .sortsel { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 7px 10px; font-size: 12px; background: #fff; margin-bottom: 4px; }
  .item { padding: 10px 0; border-top: 1px solid var(--line); }
  .iname { display: flex; align-items: center; gap: 8px; }
  .iname .serif { font-size: 16px; }
  .meta { font-size: 12px; color: var(--muted); }
  .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .pill { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 12px; font-size: 12px; }
  .pill.dark { background: var(--ink); color: #fff; border-color: var(--ink); font-weight: 600; }
  .pill.wine { background: var(--wine); color: #fff; border-color: var(--wine); font-weight: 600; padding: 7px 16px; font-size: 14px; }
  .pill.wine:disabled { background: #B9C4B8; border-color: #B9C4B8; }
  .pill.big { padding: 0 14px; font-size: 14px; white-space: nowrap; }
  .link { border: 0; background: transparent; color: var(--slate); text-decoration: underline; font-size: 12px; padding: 4px 0; }
  .link.block { display: block; width: 100%; padding: 10px 0; font-size: 13px; border-top: 1px solid var(--line); }
  .jbar { position: sticky; top: 0; z-index: 5; background: var(--bg); padding-bottom: 8px; }
  .jtop { display: flex; gap: 8px; align-items: stretch; }
  .jtop .field { margin-top: 0; }
  .jsel { display: flex; gap: 8px; margin-top: 8px; }
  .jsel .sortsel { margin-bottom: 0; padding: 9px 10px; font-size: 13px; }
  .jmeta { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); margin: 2px 0 8px; min-height: 22px; }
  .jmeta .links { display: flex; gap: 14px; }
  .jrow { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; border: 0; border-top: 1px solid var(--line); background: transparent; padding: 10px 0; text-align: left; }
  .jl { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .jl .meta { display: block; }
  .overlay { position: fixed; inset: 0; z-index: 30; background: rgba(22,38,29,.45); display: flex; align-items: flex-end; justify-content: center; }
  .sheet { width: 100%; max-width: 480px; max-height: 92vh; max-height: 92dvh; overflow-y: auto; background: var(--panel); border-radius: 24px 24px 0 0; padding: 0 20px 24px; }
  .sheethead { position: sticky; top: 0; z-index: 2; background: var(--panel); padding: 18px 0 10px; display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
  .sheettitle { min-width: 0; } .sheettitle .big { font-size: 20px; }
  .sheetbtns { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .xbtn { border: 0; background: transparent; font-size: 30px; line-height: 1; padding: 0 4px; color: var(--ink); }
  .verdicts { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
  .vbtn { width: 100%; text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 12px; padding: 12px 14px; font-size: 15px; }
  .vbtn.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .vbtn.tog { text-align: center; padding: 10px 6px; }
  .three { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 10px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  h3.serif { font-size: 18px; font-weight: 400; margin: 20px 0 6px; }
  .dim { margin-top: 12px; }
  .dimtop { display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
  .dimrow { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .dimrow input[type=range] { flex: 1; min-width: 0; accent-color: var(--slate); }
  .round { width: 36px; height: 36px; flex-shrink: 0; border-radius: 50%; border: 1px solid var(--line); background: #fff; font-size: 20px; line-height: 1; padding: 0; }
  .dimlabels { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); padding: 0 44px; }
  textarea.field { resize: none; }
  /* Start-up problems and account links */
  #bootError { position: fixed; inset: 0; z-index: 100; background: var(--bg, #dfe6dd); display: flex; align-items: center; justify-content: center; padding: 24px; }
  #bootError[hidden] { display: none; }
  .bootbox { max-width: 420px; font-size: 15px; line-height: 1.45; }
  .bootbox b { font-size: 20px; display: block; margin-bottom: 8px; }
  .bootdetail { font: 12.5px/1.45 ui-monospace, Menlo, monospace; background: #fff; border-radius: 10px; padding: 10px; word-break: break-word; }
  .bootbox button { font: inherit; padding: 10px 16px; border-radius: 12px; border: 0; background: #14201a; color: #fff; }
  .acctfoot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; margin-top: 14px; font-size: 13px; }
  .dangerlink { color: var(--wine); }
  /* Accounts */
  .okbox { background: #E3EDE1; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 13px; margin: 10px 0 4px; }
  .codefield { text-align: center; font-size: 24px; letter-spacing: .3em; }
  .acctlinks { display: flex; justify-content: space-between; gap: 12px; margin-top: 12px; }
  .acctlinks .link:disabled { color: var(--muted); text-decoration: none; }
  /* Fixed choices (oak, CO2), delete buttons and the confirmation */
  .seg { display: flex; gap: 6px; margin: 6px 0 4px; }
  .segbtn { flex: 1; border: 1px solid var(--line); background: #fff; border-radius: 12px; padding: 11px 4px; font-size: 14px; }
  .segbtn.on { background: var(--ink); color: #fff; border-color: var(--ink); font-weight: 600; }
  .segbtn.on.def { background: var(--slate); border-color: var(--slate); }
  .btn.danger { background: transparent; color: var(--wine); border: 1px solid var(--wine); font-weight: 500; }
  .btn.danger:disabled { opacity: .5; }
  .pill.danger { color: var(--wine); border-color: var(--wine); }
  .overlay.top { z-index: 60; align-items: center; padding: 20px; }
  .sheet.small { border-radius: 20px; padding: 20px; max-height: none; }
  .sheet.small .two { margin-top: 10px; } .sheet.small .btn { margin-top: 0; }
  /* Photos, thumbnails, feedback and the editor */
  .thumb { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; flex-shrink: 0; background: var(--line); }
  .item.withthumb { display: flex; gap: 10px; align-items: flex-start; } .ibody { min-width: 0; flex: 1; }
  .jrow .thumb { margin-right: 10px; }
  .photoarea { margin-top: 12px; } .photoarea.top { margin-top: 4px; }
  .phs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .ph { position: relative; width: 72px; height: 72px; } .ph img { width: 72px; height: 72px; object-fit: cover; border-radius: 10px; display: block; }
  .ph.gone img { opacity: .3; }
  .phx { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: var(--ink); color: #fff; font-size: 14px; line-height: 1; padding: 0; }
  .addph, .photobtns .pill { display: inline-block; cursor: pointer; }
  .photobtns { display: flex; flex-wrap: wrap; gap: 8px; }
  .uidline { margin-top: 16px; word-break: break-all; } .uid { user-select: all; -webkit-user-select: all; font-family: ui-monospace, monospace; }
  /* Profile tab */
  .profile { display: flex; flex-direction: column; }
  .ptabs { position: sticky; top: 0; z-index: 4; background: var(--bg); display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; padding-bottom: 10px; }
  .ptabs .tile { min-height: 58px; }
  .ph { font-size: 22px; font-weight: 400; margin: 4px 0 6px; }
  .pcard { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-top: 10px; }
  .ptitle { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .ptext { margin: 2px 0; font-size: 14px; line-height: 1.5; }
  .ptext.para { margin-top: 14px; }
  .pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .pstat { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
  .pnum { font-size: 28px; line-height: 1; margin-bottom: 6px; }
  .pbig { font-size: 32px; line-height: 1; }
  .prank { color: var(--wine); font-weight: 600; font-size: 14px; margin-top: 6px; }
  .twobig { display: flex; gap: 28px; } .twobig .small { margin-top: 6px; }
  .dimrow2 { margin: 6px 0 16px; } .dimrow2:last-child { margin-bottom: 4px; }
  .dimends { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); } .dimends b { color: var(--ink); }
  .leanbar { position: relative; height: 6px; border-radius: 999px; background: var(--line); margin: 10px 0 8px; }
  .knob { position: absolute; top: -5px; width: 16px; height: 16px; border-radius: 50%; background: var(--wine); transition: left 300ms; }
  .slate { color: var(--slate); } .tiny { font-size: 11px; }
  .wheel { display: block; width: 100%; max-width: 280px; margin: 0 auto 12px; }
  .leg { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 14px; padding: 4px 0; }
  .leg span:first-child { display: flex; align-items: center; gap: 8px; } .leg i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .leg .small { text-align: right; }
  .tgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
  .tstat { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px; } .tstat .serif { font-size: 20px; line-height: 1; margin-bottom: 4px; }
  .drow { margin: 8px 0 12px; } .dtop { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
  .kv { display: flex; justify-content: space-between; font-size: 14px; padding: 3px 0; }
  .psub { font-size: 14px; margin: 18px 0 8px; }
  .tgrid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .trophy { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 3px; }
  .ttop2 { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .tbadge { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .tdots { display: flex; gap: 4px; } .tdots i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .ttl { font-size: 14px; font-weight: 600; }
  .trophy .lbar { margin-top: 6px; }
  /* Learn tab */
  .learn { display: flex; flex-direction: column; }
  .modes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .tile { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 60px; border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 6px 2px; }
  .tile span { font-size: 10px; font-weight: 500; }
  .tile.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .chips { display: flex; gap: 4px; margin-top: 8px; overflow: hidden; }
  .chips.left { justify-content: flex-start; }
  .chip { flex: 1 1 auto; white-space: nowrap; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 6px; font-size: min(11px, 2.9vw); font-weight: 500; }
  .chip.wide { flex: 0 0 auto; padding: 6px 16px; font-size: 12px; }
  .chip.on { background: var(--slate); color: #fff; border-color: var(--slate); }
  #lbody { margin-top: 14px; }
  .qtext { font-size: 22px; font-weight: 400; line-height: 1.25; margin: 10px 0 12px; }
  .lbar { height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; margin-top: 6px; }
  .lbar.thin { height: 4px; }
  .lbar div { height: 100%; background: var(--slate); transition: width 300ms; }
  .ttop { display: flex; justify-content: space-between; font-size: 14px; }
  .opts { display: flex; flex-direction: column; gap: 8px; }
  .opt { display: flex; justify-content: space-between; align-items: center; text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 12px; padding: 12px 14px; font-size: 15px; }
  .opt:disabled { color: var(--ink); opacity: 1; }
  .opt.right { background: var(--ink); color: #fff; border-color: var(--ink); }
  .opt.wrong { background: var(--wine); color: #fff; border-color: var(--wine); }
  .fb { font-size: 14px; margin: 14px 0 0; }
  .lacts { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 12px; }
  .btn.slim { width: auto; margin-top: 0; padding: 12px 18px; font-size: 15px; }
  .link.bigger { font-size: 14px; margin-top: 12px; align-self: flex-start; }
</style>
</head>
<body>
<div id="app"></div>
<div id="overlay"></div>
<div id="confirm"></div>
<div id="bootError" hidden></div>
<script>
// If the app cannot start, say why on the screen instead of leaving a blank page.
(function () {
  window.__booted = false;
  var shown = false;
  function show(detail) {
    if (window.__booted || shown) return;
    shown = true;
    var el = document.getElementById("bootError");
    el.innerHTML = '<div class="bootbox"><b>The app could not start.</b><p>Reloading often fixes it. If it keeps happening, open the check page to see which file is wrong.</p><p class="bootdetail"></p><p><button onclick="location.reload()">Reload</button> &nbsp; <a href="check.html">Open the check page</a></p></div>';
    el.querySelector(".bootdetail").textContent = detail;
    el.hidden = false;
  }
  window.__bootFailed = show;
  window.addEventListener("error", function (e) {
    // only problems in this site's own files, so unrelated browser extensions cannot trigger it
    if (e.filename && e.filename.indexOf(location.origin) === 0) show(e.message || "A file of the app has an error.");
  });
  window.addEventListener("unhandledrejection", function (e) { show(String((e.reason && e.reason.message) || e.reason || "Unknown problem")); });
  setTimeout(function () { show("The app is taking too long to start. Check your connection."); }, 20000);
})();
</script>
<script type="module" src="app.js?v=9" onerror="window.__bootFailed('A file the app needs could not be loaded.')"></script>
</body>
</html>
